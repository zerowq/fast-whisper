<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faster-Whisper ASR Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
        }

        .upload-zone {
            border: 2px dashed rgba(99, 102, 241, 0.4);
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            transform: translateY(-2px);
        }

        .upload-zone svg {
            width: 64px;
            height: 64px;
            color: var(--primary);
            margin-bottom: 20px;
        }

        input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .status-area {
            margin-top: 30px;
            text-align: center;
            display: none;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: var(--primary);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        .results {
            margin-top: 40px;
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .lang-badge {
            background: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .segment-list {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .segment-item {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--secondary);
            border-radius: 4px;
            transition: background 0.2s;
        }

        .segment-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .time {
            color: #94a3b8;
            font-family: monospace;
            font-size: 0.9rem;
            min-width: 100px;
        }

        .text {
            line-height: 1.6;
        }

        /* Utils */
        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>ASR Test Experience</h1>
        <p>高性能离线语音转文字服务体验中心</p>
    </div>

    <div class="container">
        <div class="upload-zone" id="dropZone">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
            <p style="font-size: 1.2rem; margin-bottom: 8px;">点击或拖拽音频文件到此处</p>
            <p style="color: #94a3b8; font-size: 0.9rem;">支持 WAV, MP3, M4A, FLAC 等格式</p>
            <input type="file" id="fileInput" accept="audio/*">
        </div>

        <div class="status-area" id="statusArea">
            <span class="loader"></span>
            <p style="margin-top: 15px; color: #818cf8;">正在进行深度模型推理识别，请稍候...</p>
        </div>

        <div class="results" id="results">
            <div class="result-header">
                <h3>识别结果</h3>
                <span class="lang-badge" id="langBadge">Detecting...</span>
            </div>
            <div class="segment-list" id="segmentList">
                <!-- Segments will appear here -->
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const statusArea = document.getElementById('statusArea');
        const results = document.getElementById('results');
        const segmentList = document.getElementById('segmentList');
        const langBadge = document.getElementById('langBadge');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleUpload(e.target.files[0]);
        });

        async function handleUpload(file) {
            // Reset UI
            statusArea.style.display = 'block';
            results.style.display = 'none';
            segmentList.innerHTML = '';

            const formData = new FormData();
            formData.append('file', file);

            try {
                // Dynamically calculate API path to support sub-folders like /faster-whisper
                const currentPath = window.location.pathname.replace(/\/$/, '');
                const apiUrl = currentPath + '/transcribe';
                console.log('Fetching from:', apiUrl);

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Transcription failed');

                const data = await response.json();
                displayResults(data);
            } catch (err) {
                alert('识别失败: ' + err.message);
            } finally {
                statusArea.style.display = 'none';
            }
        }

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = (seconds % 60).toFixed(2);
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.padStart(5, '0')}`;
        }

        function displayResults(data) {
            results.style.display = 'block';
            langBadge.innerText = `${data.language.toUpperCase()} (${(data.language_probability * 100).toFixed(1)}%)`;

            data.segments.forEach(seg => {
                const div = document.createElement('div');
                div.className = 'segment-item';
                div.innerHTML = `
                    <div class="time">[${formatTime(seg.start)} -> ${formatTime(seg.end)}]</div>
                    <div class="text">${seg.text}</div>
                `;
                segmentList.appendChild(div);
            });
        }
    </script>
</body>

</html>
