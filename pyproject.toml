[project]
name = "faster-whisper-service"
version = "2.0.0"
description = "Optimized Faster-Whisper ASR Service with Base model (74M parameters) for balanced performance and quality"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Faster-Whisper ASR Service", email = "contact@example.com"}
]
license = {text = "MIT"}
keywords = ["whisper", "asr", "speech-recognition", "fastapi", "faster-whisper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "faster-whisper>=1.0.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "pynvml>=11.5.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.88.0",
    "python-dotenv>=1.0.0",
    "colorlog>=6.7.0",
]

[project.urls]
Homepage = "https://github.com/zerowq/fast-whisper"
Repository = "https://github.com/zerowq/fast-whisper"
Issues = "https://github.com/zerowq/fast-whisper/issues"
Documentation = "https://github.com/zerowq/fast-whisper#readme"

[project.scripts]
faster-whisper-service = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# UV package manager configuration
[tool.uv]
# Use PyPI as default index
index-url = "https://pypi.org/simple/"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
